<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:"><title>Neutron hangasszisztens</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;border:1px solid #68567d;background:linear-gradient(115deg,#292037,#171320);color:#eee8fa;font:14px system-ui;display:flex;align-items:center;gap:14px;padding:15px}

</style></head><body><img id="picture" src="icon.png" alt=""><section><strong id="name"></strong><span id="phase"></span><p id="status" role="status"></p></section><script src="voice-hud.js"></script></body></html>
