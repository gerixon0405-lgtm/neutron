name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
env:
  PYTHONUTF8: "1"
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: win}
          - {os: ubuntu-24.04, platform: linux}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install Node dependencies
        run: npm ci --no-fund --no-audit
      - name: Prepare Windows private Python runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-runtime.ps1
      - name: Install Linux build and test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libarchive-tools libfuse2t64 ffmpeg
          python -m pip install requests
      - name: Install Windows FFmpeg for rendering tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue) -or !(Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Windows app helpers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build/python/python.exe -m unittest -v test_mail test_chat_outputs test_desktop_integrations test_search_maintenance test_spotify_api test_video_render test_discord_bot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/python/python.exe scripts/smoke_windows.py
      - name: Test Linux app helpers
        if: runner.os == 'Linux'
        run: python -m unittest -v test_mail test_chat_outputs test_desktop_integrations test_search_maintenance test_spotify_api test_video_render test_discord_bot
      - name: Test FCC model catalog
        run: node scripts/test-fcc-catalog.js
      - name: Test direct Windows maintenance command
        run: node scripts/test-maintenance-command.js
      - name: Verify bundled release notes
        run: node scripts/release-notes.js
      - name: Test chat attachments and rate limit policy
        run: node scripts/test-chat-input.js
      - name: Test local Claude Desktop session import
        run: node scripts/test-claude-import.js
      - name: Package application
        run: npm run dist -- --${{ matrix.platform }} --x64
      - name: Check packaged app and update metadata
        shell: bash
        run: node scripts/verify-release.js ${{ matrix.platform }}
      - name: Smoke test installed Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: neutron-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {path: release, merge-multiple: true}
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          node scripts/release-notes.js > release-notes.md
          gh release create "$TAG" release/* --repo "$REPO" --verify-tag --title "Neutron ${TAG#v}" --notes-file release-notes.md
